# Mounts the local 130 GB backup folder (on D:) into the container, READ-ONLY,
# so we can inspect and restore from it without copying 130 GB onto C:.
# docker compose automatically merges this with docker-compose.yml.
services:
  sage-mssql:
    volumes:
      - type: bind
        source: "D:\\Airco Systemdruckluft GmbH\\Airco Systemdruckluft GmbH\\Projekt Big-Picture - Backup SQL"
        target: /backup
        read_only: true
